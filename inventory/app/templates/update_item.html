{% extends "master.html" %}

{% load static %}

{% block title %}
Item güncelleme
{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'grid.css' %}"> 
<div class="mycard">
    <h1>Item güncelleme</h1>
    <ul>
        placeholder
    </ul>
    <h2>Update User Information</h2>

      <form method="post", id="Form">
        {% csrf_token %}
        <div>
          <label> Bakanlık Adı: </label> 
          
          <input type="text" value="{{ item.bakanlik_adi }}" readonly>
        </div> 
        
        <div>
          <label for="daire_adi"> Daire Adı: </label> 
          <input type="text" value="{{ item.daire_adi }}" readonly>
        </div> 
        
        <div>
          <label for="ayniyat_no"> Ayniyat No: </label>
          <input type="text" value="{{ item.ayniyat_no }}" readonly>
        </div>
        
        <div>
          <label for="malzeme_adi"> Malzeme Adı: </label>
          {{ form.malzeme_adi }}
        </div>
        
        <div>
          <label for="kiymet"> Kıymet: </label> 
          <input type="float" value="{{ item.kiymet }}" readonly>
        </div>
        
        <div>
          <label for="fatura_no"> Fatura No: </label> 
          <input type="int" value="{{ item.fatura_no }}" readonly>
        </div> 

        <div>
          <label for="aciklama"> Açıklama: </label> 
          {{ form.aciklama }}
        </div> 

        <div>
          <label for="demirbas_no"> Demirbaş No: </label> 
          <input type="text" value="{{ item.demirbas_no }}" readonly>
        </div>
        
        <div>
          <label> Bulunduğu oda: </label> 
          {{ form.allocated_room }}
        </div> 
        <button type="submit">Update</button>
        <div class="buttons">
            <a href="{% url 'item_details' item.id %}" class="button">
                Cancel
            </a>
        </div>
      </form>

{% endblock %}
